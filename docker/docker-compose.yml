version: '3.8'

services:
  mongo:
    build: .
    container_name: mongodb
    restart: always
    environment:
      # These credentials will be used by the initialization logic
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: